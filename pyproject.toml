[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myoe"
version = "0.1.0"
description = "Lightweight cross-user sEMG recognition and personalization"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "torch>=2.3,<3", "threadpoolctl>=3.1,<4"]

[project.optional-dependencies]
demo = ["streamlit>=1.35,<2", "pandas>=2,<4", "plotly>=5,<7"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["myoe*"]

[tool.setuptools.package-data]
myoe = ["data/*.npz", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
